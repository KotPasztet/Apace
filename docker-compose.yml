# Apace — v2 dimension-based architecture.
#
# One persistent Fabric server + one persistent bridge are now shared by ALL game
# instances. A game instance is a *dimension* inside the single persistent Fabric
# server (managed via createInstance/destroyInstance on the event bus), not a
# separate JVM process as in v1.
#
# The ports below are therefore SHARED services, not per-instance ports:
#   - 5000      launcher UI / panel (ASP.NET Core)
#   - 1808      public HTTP API (ApiPort from config.json; 1808 on fresh installs)
#   - 5532      event bus (TCP, orchestrator <-> ViennaConnectorPlugin)
#   - 19132/udp the SINGLE shared bridge Bedrock port (all instances connect here)
services:
  apace:
    # Only the dev channel is actively published: docker-image-dev.yml builds
    # ghcr.io/apaceproject/apace:dev on every push to dev, while a :main image
    # only ever appears from one-off tag pushes and immediately goes stale
    # (missing the iOS login routes, cosmetics, etc.). Default to the image
    # that actually exists and receives the fixes; installs that want to pin
    # the main channel can set APACE_CHANNEL=main in the .env next to this
    # file (the panel's self-update writes that var).
    image: ghcr.io/apaceproject/apace:${APACE_CHANNEL:-dev}
    pull_policy: always

    restart: unless-stopped

    ports:
      - "5000:5000"        # launcher UI / panel
      - "1808:1808"        # public HTTP API (ApiPort from config.json)
      - "5532:5532"        # event bus (TCP)
      - "${BRIDGE_PORT:-19132}:${BRIDGE_PORT:-19132}/udp"  # single shared bridge Bedrock port (all instances); set BRIDGE_PORT to match the panel's "Buildplate Bridge Port" setting

    volumes:
      - /opt/apace-persistent/launcher-data:/app/launcher/Data
      - /opt/apace-persistent/config.json:/app/launcher/config.json
      # NOTE: the ApiServer's login secrets (api_config.json) live in /app/data
      # (the volume below) — the server writes them there itself. Do NOT
      # bind-mount api_config.json as a single file: when the host file is
      # missing, Docker creates a DIRECTORY at the mount path and the server
      # regenerates random secrets on every boot, locking clients out in a
      # 401 loop on user/authenticate.
      - /opt/apace-persistent/launcher-logs:/app/launcher/logs
      - /opt/apace-persistent/data:/app/data
      - /opt/apace-persistent/dataprotection-keys:/root/.aspnet/DataProtection-Keys
      - /opt/apace-persistent/resourcepacks:/app/staticdata/resourcepacks
      - /opt/apace-persistent/server-template-dir:/app/staticdata/server_template_dir
      - /opt/apace-persistent/logs:/app/logs
      # persistent data for the single shared Fabric server (all dimensions/worlds)
      - /opt/apace-persistent/fabric-data:/app/launcher/persistent_fabric
      # SECURITY: the docker socket is root-equivalent on the host. It is mounted
      # on purpose so the panel can run its "Update now" self-update (About page,
      # SelfUpdateService: docker compose pull + up -d on this very stack).
      # Remove this line if you prefer the panel to never touch docker.
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      - DOTNET_SYSTEM_NET_DISABLEIPV6=1
      - COMPlus_gcServer=0
      - COMPlus_gcConcurrent=1
      - DOTNET_GCHeapHardLimit=536870912
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - APACE_LOG_CLIENT_REQUESTS=1
      - APACE_CHANNEL=${APACE_CHANNEL:-dev}
      # Host bridge port mapping, mirrored into the container so the panel's
      # in-place self-update re-publishes the same port (SelfUpdateService).
      - BRIDGE_PORT=${BRIDGE_PORT:-19132}

    deploy:
      resources:
        limits:
          # one shared Fabric server now hosts all instances, so give it more headroom
          memory: 4g
