name: Developer Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Lint install scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax-check shell scripts (bash -n)
        run: |
          status=0
          for f in install.sh install-termux.sh run.sh setup-dirs.sh \
                   scripts/update.sh scripts/tailscale-setup.sh scripts/entrypoint.sh; do
            if [ -f "$f" ]; then
              bash -n "$f" || status=1
            else
              echo "::notice::skipping missing script: $f"
            fi
          done
          exit $status

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq shellcheck || echo "::warning::shellcheck could not be installed"
          fi

      - name: Shellcheck shell scripts (advisory)
        run: |
          if ! command -v shellcheck >/dev/null; then
            echo "::notice::shellcheck not available — skipped"
            exit 0
          fi
          found=0
          for f in install.sh install-termux.sh run.sh setup-dirs.sh \
                   scripts/update.sh scripts/tailscale-setup.sh scripts/entrypoint.sh; do
            if [ -f "$f" ]; then
              shellcheck "$f" || found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::warning::shellcheck reported issues above (advisory — not failing the build)"
          else
            echo "shellcheck: no findings"
          fi

      - name: Compile-check Python scripts
        run: |
          if [ -f scripts/migrate-from-solace.py ]; then
            python3 -m py_compile scripts/migrate-from-solace.py
          else
            echo "::notice::skipping missing script: scripts/migrate-from-solace.py"
          fi

  build_and_dev_release:
    needs: lint
    if: github.ref_name == 'dev'
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - os: win
            arch: x64
          - os: win
            arch: arm64
          - os: linux
            arch: x64
          - os: linux
            arch: arm64
          - os: osx
            arch: x64
          - os: osx
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: |
          ./publish.ps1 -profiles framework-dependent-${{ matrix.os }}-${{ matrix.arch }}

      - name: Zip build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/Release/framework-dependent-${{ matrix.os }}-${{ matrix.arch }}/*" `
            -DestinationPath "Apace-Dev-${{ matrix.os }}-${{ matrix.arch }}.zip"

      - name: Update Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: "Apace Development Build"
          prerelease: true
          files: Apace-Dev-${{ matrix.os }}-${{ matrix.arch }}.zip
          generate_release_notes: true
          body: |
            ⚠️ **Warning:** This is a manually triggered developer snapshot. It may contain unfinished features or bugs.
            
            **Source Branch:** ${{ github.ref_name }}
            **Commit SHA:** ${{ github.sha }}
            
            ---
            ![Apace Banner](https://raw.githubusercontent.com/ApaceProject/Apace/main/images/Apace_Banner.png)
