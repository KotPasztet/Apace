name: Build and publish Docker image (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint install scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax-check shell scripts (bash -n)
        run: |
          status=0
          for f in install.sh install-termux.sh run.sh setup-dirs.sh \
                   scripts/update.sh scripts/tailscale-setup.sh scripts/entrypoint.sh; do
            if [ -f "$f" ]; then
              bash -n "$f" || status=1
            else
              echo "::notice::skipping missing script: $f"
            fi
          done
          exit $status

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq shellcheck || echo "::warning::shellcheck could not be installed"
          fi

      - name: Shellcheck shell scripts (advisory)
        run: |
          if ! command -v shellcheck >/dev/null; then
            echo "::notice::shellcheck not available - skipped"
            exit 0
          fi
          found=0
          for f in install.sh install-termux.sh run.sh setup-dirs.sh \
                   scripts/update.sh scripts/tailscale-setup.sh scripts/entrypoint.sh; do
            if [ -f "$f" ]; then
              shellcheck "$f" || found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::warning::shellcheck reported issues above (advisory - not failing the build)"
          else
            echo "shellcheck: no findings"
          fi

      - name: Compile-check Python scripts
        run: |
          if [ -f scripts/migrate-from-solace.py ]; then
            python3 -m py_compile scripts/migrate-from-solace.py
          else
            echo "::notice::skipping missing script: scripts/migrate-from-solace.py"
          fi
  build:
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 1 }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/apaceproject/apace:sha-${{ github.sha }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker buildx imagetools create -t ghcr.io/apaceproject/apace:dev \
            ghcr.io/apaceproject/apace:sha-${{ github.sha }}-amd64 \
            ghcr.io/apaceproject/apace:sha-${{ github.sha }}-arm64
